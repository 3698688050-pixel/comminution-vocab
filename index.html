<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>粉碎词汇 · comminution lexicon</title>
<meta name="description" content="工业物料与粉碎设备专业词汇，1000 词随到随背：中文看面，翻面得英文、词根与化学性质。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <span class="brand-cn">粉碎词汇</span>
      <span class="brand-en">comminution lexicon</span>
    </div>
    <nav class="views" role="tablist">
      <button class="view-btn" id="tabStudy" role="tab" aria-selected="true">背词</button>
      <button class="view-btn" id="tabIndex" role="tab" aria-selected="false">词表</button>
    </nav>
  </header>

  <div class="scopes" id="scopes" role="group" aria-label="词库范围"></div>

  <main>
    <section id="viewStudy" aria-labelledby="tabStudy">
      <div class="deck">
        <div class="card" id="card" data-flipped="false" tabindex="0" role="button"
             aria-pressed="false" aria-live="polite"></div>
      </div>

      <div class="controls">
        <button class="btn" id="prev">上一张</button>
        <button class="btn btn--primary" id="next">下一个</button>
      </div>

      <div class="meta-row">
        <span class="stats">
          <span id="progress"></span>
          <span id="library" class="also"></span>
        </span>
        <span class="meta-acts">
          <button class="linkish" id="mark" data-on="false">标记已掌握</button>
          <button class="linkish" id="reset">清空进度</button>
        </span>
      </div>
    </section>

    <section id="viewIndex" hidden aria-labelledby="tabIndex">
      <input class="search" id="search" type="search" placeholder="搜索中文、英文、词根或化学式" autocomplete="off">
      <ul class="rows" id="rows"></ul>
      <div class="empty" id="empty" hidden>没有匹配的词条。换个写法，或切回「背词」继续。</div>
    </section>
  </main>
</div>

<script src="data/terms.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
